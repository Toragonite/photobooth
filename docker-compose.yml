version: '3.8'

services:
  # Backend API service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: photobooth-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/photobooth.db
      - PRINTER_MOCK_MODE=${PRINTER_MOCK_MODE:-true}
      - PRINTER_NAME=${PRINTER_NAME:-SelphyCP1500}
      - PRINTER_NAMES=${PRINTER_NAMES:-}
      - PRINTER_SELECTION_STRATEGY=${PRINTER_SELECTION_STRATEGY:-least-busy}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ADMIN_PIN=${ADMIN_PIN:-1998}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - photobooth-data:/app/data
      - /var/run/cups:/var/run/cups  # CUPS socket for printing
      - ./rootCA.pem:/app/certs/rootCA.pem:ro  # Root CA for HTTPS trust setup
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - photobooth-network

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: photobooth-frontend
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - photobooth-network

  # Nginx reverse proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: photobooth-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - photobooth-network

volumes:
  photobooth-data:
    driver: local

networks:
  photobooth-network:
    driver: bridge
