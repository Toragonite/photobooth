version: '3.8'

services:
  # Backend API service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: photobooth-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=sqlite+aiosqlite:///./data/photobooth.db
      - PRINTER_MOCK_MODE=${PRINTER_MOCK_MODE:-false}
      - PRINTER_NAME=${PRINTER_NAME:-Canon_Selphy_CP1500}
      # REQUIRED: Set these in .env file before deployment
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required - generate with: openssl rand -base64 32}
      - ADMIN_PIN=${ADMIN_PIN:?ADMIN_PIN is required - set a secure 4-8 digit PIN}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - photobooth-data:/app/data
      - /var/run/cups:/var/run/cups  # CUPS socket for printing
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - photobooth-network

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: photobooth-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - photobooth-network

  # Nginx reverse proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: photobooth-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - photobooth-network

volumes:
  photobooth-data:
    driver: local

networks:
  photobooth-network:
    driver: bridge
